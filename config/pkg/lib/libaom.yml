libaom:
  type: library
  artifact:
    source:
      type: filelist
      url: 'https://storage.googleapis.com/aom-releases/'
      regex: '/<Key>(?<file>libaom-(?<version>\d+\.\d+\.\d+)\.tar\.gz)<\/Key>/'
    metadata:
      license-files: [LICENSE]
  lang: cpp
  static-libs@unix:
    - libaom.a
  static-libs@windows:
    - aom.lib
