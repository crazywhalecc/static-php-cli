openssl:
  type: library
  artifact:
    source:
      type: ghrel
      repo: openssl/openssl
      match: openssl-4\.\d+\.\d+\.tar\.gz
      prefer-stable: true
    source-mirror:
      type: filelist
      url: 'https://www.openssl.org/source/'
      regex: '/href="(?<file>openssl-(?<version>4\.\d+\.\d+)\.tar\.gz)"/'
    metadata:
      license-files: [LICENSE.txt]
      license: OpenSSL
  depends:
    - zlib
  depends@windows:
    - zlib
    - jom
  headers:
    - openssl
  static-libs@unix:
    - libssl.a
    - libcrypto.a
  static-libs@windows:
    - libssl.lib
    - libcrypto.lib
