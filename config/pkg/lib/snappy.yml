snappy:
  type: library
  artifact:
    source:
      type: ghtar
      repo: google/snappy
      prefer-stable: true
    metadata:
      license-files: [COPYING]
      license: BSD-3-Clause
  depends:
    - zlib
  headers@unix:
    - snappy.h
    - snappy-c.h
    - snappy-sinksource.h
    - snappy-stubs-public.h
  headers@windows:
    - snappy.h
    - snappy-c.h
    - snappy-sinksource.h
    - snappy-stubs-public.h
  lang: cpp
  static-libs@unix:
    - libsnappy.a
  static-libs@windows:
    - snappy.lib
